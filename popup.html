<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 600px;
      min-height: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #00d4ff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: "\26A1";
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #commandInput {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    #commandInput:focus {
      border-color: #00d4ff;
    }

    #commandInput::placeholder {
      color: #666;
    }

    .btn {
      padding: 14px 22px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #executeBtn {
      background: #00d4ff;
      color: #1a1a2e;
    }

    #stopBtn {
      background: #ff4757;
      color: #fff;
    }

    .status-header {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    #statusLog {
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      height: 280px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.7;
    }

    .log-entry {
      color: #8892b0;
      word-wrap: break-word;
    }

    .log-entry.info {
      color: #64ffda;
    }

    .log-entry.error {
      color: #ff4757;
    }

    .log-entry.action {
      color: #ffd93d;
    }

    #statusLog::-webkit-scrollbar {
      width: 6px;
    }

    #statusLog::-webkit-scrollbar-track {
      background: transparent;
    }

    #statusLog::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>AI Task Automator</h1>

  <div class="input-group">
    <input type="text" id="commandInput" placeholder="e.g. go to youtube and search for cats" autofocus>
    <button class="btn" id="executeBtn">Execute</button>
    <button class="btn" id="stopBtn" disabled>Stop</button>
  </div>

  <div class="status-header">Status Log</div>
  <div id="statusLog"></div>

  <script src="popup.js"></script>
</body>
</html>
